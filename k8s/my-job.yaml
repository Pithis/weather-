apiVersion: batch/v1
kind: Job
metadata:
  name: my-job
  namespace: my-app
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: my-job
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Job started"
              echo "Running task..."
              sleep 10
              echo "Job completed"
  backoffLimit: 3
